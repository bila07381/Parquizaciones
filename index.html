<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Parquizaciones y Mantenimientos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12341c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parquizaciones">
<style>
:root{
  --verde-oscuro:#12341c;
  --verde-medio:#1f5c34;
  --verde-claro:#2f8a4c;
  --verde-acento:#3fae5c;
  --rojo:#c0392b;
  --amarillo:#c8961e;
  --gris-fondo:#f4f6f4;
  --gris-texto:#5b6b60;
  --borde:#e2e8e3;
  --tarjeta:#ffffff;
  --texto:#1a1a1a;
}
[data-theme="oscuro"]{
  --gris-fondo:#0f1712;
  --tarjeta:#1a241d;
  --borde:#2a352c;
  --texto:#eef2ee;
  --gris-texto:#93a396;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--gris-fondo);
  color:var(--texto);
  overscroll-behavior:none;
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--gris-fondo);
  position:relative;
  padding-bottom:70px;
}
/* ---- Header estilos ---- */
.app-header{
  background:var(--verde-oscuro);
  color:#fff;
  padding:16px 16px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky; top:0; z-index:20;
}
.app-header .back{
  font-size:20px; background:none; border:none; color:#fff; cursor:pointer;
  width:28px; height:28px; display:flex; align-items:center; justify-content:center;
}
.app-header h1{font-size:17px; font-weight:700; flex:1;}
.app-header .action{
  background:none; border:none; color:#fff; font-size:22px; cursor:pointer;
}

.home-header{
  background:linear-gradient(180deg, var(--verde-oscuro), var(--verde-medio));
  padding:20px 18px 16px; color:#fff; text-align:center; position:relative;
}
.home-logo{
  width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,.15);
  display:flex; align-items:center; justify-content:center; font-size:26px;
  margin:0 auto 8px; overflow:hidden;
}
.home-logo img{width:100%; height:100%; object-fit:cover;}
.home-title{font-size:17px; font-weight:800; line-height:1.3;}

.content{flex:1; padding:14px 16px; overflow-y:auto;}

/* ---- Bottom nav ---- */
.bottom-nav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  background:var(--verde-oscuro);
  display:flex; justify-content:space-around;
  padding:8px 4px 10px;
  z-index:30;
}
.nav-btn{
  background:none; border:none; color:#8fae95; display:flex; flex-direction:column;
  align-items:center; gap:2px; font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 8px;
}
.nav-btn .ic{font-size:18px;}
.nav-btn.active{color:#7fe0a0;}

/* ---- Componentes generales ---- */
.field{margin-bottom:12px;}
.field label{
  font-size:11px; color:var(--gris-texto); font-weight:700;
  display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px;
}
.field input, .field textarea, .field select{
  width:100%; border:1.5px solid var(--borde); border-radius:10px;
  padding:10px 11px; font-size:14px; background:var(--tarjeta); color:var(--texto);
  font-family:inherit;
}
.field textarea{resize:none; height:64px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.btn{
  display:block; width:100%; text-align:center;
  padding:12px; border-radius:10px; font-size:14.5px; font-weight:700;
  border:none; margin-top:8px; cursor:pointer;
}
.btn-guardar{background:var(--verde-acento); color:#fff;}
.btn-cancelar{background:var(--tarjeta); color:var(--gris-texto); border:1.5px solid var(--borde);}
.btn-eliminar{background:#fdeceb; color:var(--rojo);}
[data-theme="oscuro"] .btn-eliminar{background:#3a2321;}

.section-title{
  font-size:12px; font-weight:800; color:var(--verde-medio);
  text-transform:uppercase; letter-spacing:.4px;
  margin:16px 0 8px;
  display:flex; justify-content:space-between; align-items:center;
}
[data-theme="oscuro"] .section-title{color:#7fe0a0;}

.empty-state{
  text-align:center; padding:40px 20px; color:var(--gris-texto); font-size:13px;
}

/* Buscador */
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--tarjeta);
  border:1.5px solid var(--borde); border-radius:12px; padding:10px 14px; margin-bottom:12px;
}
.search-box input{border:none; outline:none; flex:1; font-size:14px; background:transparent; color:var(--texto);}

/* Lista clientes */
.cliente-card{
  display:flex; align-items:center; gap:12px; background:var(--tarjeta);
  border:1px solid var(--borde); border-radius:14px; padding:12px 14px; margin-bottom:10px;
  cursor:pointer;
}
.avatar{
  width:44px; height:44px; border-radius:50%; background:var(--verde-claro); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;
}
.cliente-info{flex:1; min-width:0;}
.cliente-info .nombre{font-size:14.5px; font-weight:700; color:var(--texto);}
.cliente-info .dato{font-size:12px; color:var(--gris-texto); margin-top:2px; display:flex; align-items:center; gap:4px;}
.chev{color:var(--gris-texto); font-size:18px;}

/* Deuda / al día */
.deuda-card{
  background:#fdf3e6; border:1.5px solid #f0d9ad; border-radius:12px;
  padding:12px 14px; margin:12px 0; display:flex; justify-content:space-between; align-items:center;
}
[data-theme="oscuro"] .deuda-card{background:#3a2f18; border-color:#5c4a20;}
.deuda-card .txt{font-size:12px; color:#8a6410; font-weight:700;}
[data-theme="oscuro"] .deuda-card .txt{color:#e0b85c;}
.deuda-card .monto{font-size:19px; color:var(--amarillo); font-weight:800;}
.al-dia-card{
  background:#eaf7ee; border:1.5px solid #bfe6cb; border-radius:12px;
  padding:11px 14px; margin:12px 0; font-size:12.5px; color:#1f7a3d; font-weight:700;
}
[data-theme="oscuro"] .al-dia-card{background:#173321; border-color:#2c5c3d; color:#7fe0a0;}

/* Trabajos / turnos */
.trabajo-item{
  background:var(--tarjeta); border-radius:12px; padding:11px 12px;
  margin-bottom:8px; border:1px solid var(--borde);
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.trabajo-item .desc{font-size:13px; font-weight:700; color:var(--texto);}
.trabajo-item .fecha{font-size:11px; color:var(--gris-texto); margin-top:2px;}
.tag{font-size:10px; font-weight:700; padding:3px 8px; border-radius:7px; white-space:nowrap;}
.tag-pagado{background:#eaf7ee; color:var(--verde-claro);}
.tag-pendiente{background:#fdf3e6; color:var(--amarillo);}
.tag-espera{background:#eef1ee; color:var(--gris-texto);}
[data-theme="oscuro"] .tag-espera{background:#2a352c;}
.tag-hecho{background:#eaf7ee; color:var(--verde-claro);}

.btn-whatsapp{
  background:#e7f7ec; border:1.5px solid #b8e6c4; color:#25a244;
  width:30px; height:30px; border-radius:8px; font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
[data-theme="oscuro"] .btn-whatsapp{background:#173321; border-color:#2c5c3d; color:#3fc464;}

.turno-item{
  display:flex; align-items:center; gap:10px; background:var(--tarjeta);
  border:1px solid var(--borde); border-radius:12px; padding:10px 12px; margin-bottom:8px;
  cursor:pointer;
}
.turno-item.destacado{border-color:var(--verde-claro); background:rgba(63,174,92,.06);}
.turno-hora{font-size:11.5px; font-weight:800; color:var(--verde-medio); width:62px; line-height:1.3;}
[data-theme="oscuro"] .turno-hora{color:#7fe0a0;}
.turno-info{flex:1;}
.turno-nombre{font-size:13.5px; font-weight:700; color:var(--texto);}
.turno-tipo{font-size:11.5px; color:var(--gris-texto); margin-top:1px;}

.badge-count{
  background:var(--verde-claro); color:#fff; font-size:11px; font-weight:800;
  width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
}

.pago-toggle{display:flex; gap:8px;}
.pago-opt{
  flex:1; padding:9px; border-radius:10px; font-size:12.5px; font-weight:700;
  border:1.5px solid var(--borde); background:var(--tarjeta); color:var(--gris-texto); cursor:pointer;
}
.pago-opt.activo-pendiente{background:#fdf3e6; border-color:#f0d9ad; color:var(--amarillo);}
.pago-opt.activo-pagado{background:#eaf7ee; border-color:#bfe6cb; color:var(--verde-claro);}

/* Resumen día / home grid */
.resumen-dia-box{
  margin-top:12px; background:#eaf7ee; border:1.5px solid #bfe6cb; border-radius:14px;
  padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer;
}
[data-theme="oscuro"] .resumen-dia-box{background:#173321; border-color:#2c5c3d;}
.resumen-icon{font-size:20px;}
.resumen-titulo{font-size:12.5px; font-weight:700; color:var(--texto);}
.resumen-sub{font-size:11px; color:var(--gris-texto); margin-top:1px;}
.home-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.home-btn{
  background:var(--tarjeta); border:1.5px solid var(--borde); border-radius:14px;
  padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:6px;
  font-size:12.5px; font-weight:700; color:var(--texto); cursor:pointer;
}
.home-btn.clientes{border-color:#bfe6cb;}
.home-btn.agenda{border-color:#c6dcf2;}
.home-btn.caja{border-color:#f0e2b8;}
.home-btn.mas{border-color:#dcd2ec;}
.home-btn .ic{font-size:22px;}

/* Caja */
.caja-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px;}
.caja-card{
  background:var(--tarjeta); border:1.5px solid var(--borde); border-radius:16px;
  padding:18px 12px; text-align:center; cursor:pointer;
}
.caja-card .caja-icon{font-size:26px; margin-bottom:6px;}
.caja-card .caja-label{font-size:11.5px; font-weight:700; color:var(--gris-texto); margin-bottom:4px;}
.caja-card .caja-monto{font-size:17px; font-weight:800; color:var(--texto);}
.caja-card.ingreso{border-color:#bfe6cb;} .caja-card.ingreso .caja-monto{color:var(--verde-claro);}
.caja-card.pendiente{border-color:#f0d9ad;} .caja-card.pendiente .caja-monto{color:var(--amarillo);}
.caja-card.gasto{border-color:#f3c6c0;} .caja-card.gasto .caja-monto{color:var(--rojo);}
.caja-card.balance{border-color:#c9d6cf;} .caja-card.balance .caja-monto{color:var(--verde-medio);}

.mov-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--tarjeta); border:1px solid var(--borde); border-radius:12px;
  padding:11px 12px; margin-bottom:8px;
}
.mov-desc{font-size:13px; font-weight:700; color:var(--texto);}
.mov-fecha{font-size:11px; color:var(--gris-texto); margin-top:2px;}
.mov-monto{font-size:14px; font-weight:800; white-space:nowrap;}
.mov-monto.verde{color:var(--verde-claro);}
.mov-monto.rojo{color:var(--rojo);}
.mov-monto.naranja{color:var(--amarillo);}
.tag-manual{background:#eef1ee; color:var(--gris-texto); margin-left:6px;}
[data-theme="oscuro"] .tag-manual{background:#2a352c;}

.total-pendiente-box{
  margin-top:14px; background:#fdf3e6; border:1.5px solid #f0d9ad; border-radius:12px;
  padding:13px 14px; display:flex; justify-content:space-between; align-items:center;
  font-size:12.5px; font-weight:700; color:#8a6410;
}
[data-theme="oscuro"] .total-pendiente-box{background:#3a2f18; border-color:#5c4a20; color:#e0b85c;}
.total-pendiente-box .monto-grande{font-size:18px; color:var(--amarillo);}

.balance-total{
  background:var(--verde-oscuro); border-radius:14px; padding:15px 16px;
  display:flex; justify-content:space-between; align-items:center;
  color:#dfeee2; font-size:12.5px; font-weight:700; margin-bottom:10px;
}
.balance-total .monto-grande{font-size:20px; font-weight:800; color:#7fe0a0;}
.pendiente-strip{
  background:#fdf3e6; border-radius:10px; padding:10px 14px;
  display:flex; justify-content:space-between; font-size:11.5px; font-weight:700;
  color:#8a6410; margin-bottom:14px;
}
[data-theme="oscuro"] .pendiente-strip{background:#3a2f18; color:#e0b85c;}

.periodo-tabs{display:flex; gap:8px; margin-bottom:8px;}
.periodo-tab{
  flex:1; padding:9px 4px; border-radius:10px; font-size:11.5px; font-weight:700;
  border:1.5px solid var(--borde); background:var(--tarjeta); color:var(--gris-texto); cursor:pointer;
}
.periodo-tab.activo{background:var(--verde-oscuro); border-color:var(--verde-oscuro); color:#fff;}
[data-theme="oscuro"] .periodo-tab.activo{background:var(--verde-claro); border-color:var(--verde-claro); color:#0f1712;}
.periodo-etiqueta{text-align:center; font-size:11px; color:var(--gris-texto); margin-bottom:14px;}

.aviso-superposicion{
  margin-top:10px; background:#fdeceb; border:1.5px solid #f3c6c0; border-radius:12px;
  padding:11px 13px; font-size:12px; color:#8a2f22; line-height:1.5;
}
[data-theme="oscuro"] .aviso-superposicion{background:#3a2321; border-color:#5c342f; color:#f0a898;}

/* Calendario */
.cal-nav{
  display:flex; justify-content:space-between; align-items:center;
  font-size:15px; font-weight:800; color:var(--verde-medio); margin-bottom:10px; padding:0 4px;
}
[data-theme="oscuro"] .cal-nav{color:#7fe0a0;}
.cal-nav button{background:none; border:none; font-size:18px; color:var(--verde-medio); cursor:pointer; padding:4px 10px;}
[data-theme="oscuro"] .cal-nav button{color:#7fe0a0;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:10px;}
.cal-dow{font-size:10px; font-weight:700; color:var(--gris-texto); text-align:center; padding-bottom:4px;}
.cal-day{
  font-size:12px; text-align:center; padding:8px 0; border-radius:8px; color:var(--texto); position:relative;
  cursor:pointer; background:var(--tarjeta);
}
.cal-day.vacio{background:transparent; cursor:default;}
.cal-day.con-turno::after{
  content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%; background:var(--verde-claro);
}
.cal-day.seleccionado{background:var(--verde-oscuro); color:#fff; font-weight:800;}
.cal-day.seleccionado.con-turno::after{background:#7fe0a0;}

/* Menu opciones */
.menu-item{
  display:flex; align-items:center; gap:12px; background:var(--tarjeta);
  border:1px solid var(--borde); border-radius:12px; padding:13px 14px; margin-bottom:10px; cursor:pointer;
}
.menu-icon{font-size:19px; width:26px; text-align:center;}
.menu-txt{flex:1;}
.menu-titulo{font-size:13px; font-weight:700; color:var(--texto);}
.menu-sub{font-size:11px; color:var(--gris-texto); margin-top:1px;}

.logo-upload{display:flex; flex-direction:column; align-items:center; margin:10px 0 18px;}
.logo-preview{
  width:88px; height:88px; border-radius:50%; background:var(--verde-oscuro);
  color:#fff; font-size:34px; display:flex; align-items:center; justify-content:center;
  margin-bottom:10px; border:3px solid #eaf7ee; overflow:hidden; cursor:pointer;
}
.logo-preview img{width:100%; height:100%; object-fit:cover;}
[data-theme="oscuro"] .logo-preview{border-color:#173321;}
.btn-link{background:none; border:none; color:var(--verde-claro); font-size:12.5px; font-weight:700; cursor:pointer;}

.tema-opts{display:flex; gap:10px; margin-top:6px;}
.tema-opt{
  flex:1; border:1.5px solid var(--borde); border-radius:12px; padding:14px; text-align:center;
  cursor:pointer; font-size:12.5px; font-weight:700; color:var(--texto);
}
.tema-opt.activo{border-color:var(--verde-claro); background:rgba(63,174,92,.08);}
.tema-opt .ic{font-size:20px; display:block; margin-bottom:6px;}

/* Modal confirmar */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,20,12,.55);
  display:flex; align-items:center; justify-content:center;
  padding:24px; z-index:100;
}
.modal-box{
  background:var(--tarjeta); border-radius:16px; padding:22px 18px;
  text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3); max-width:320px; width:100%;
}
.modal-box .icon{
  width:48px; height:48px; border-radius:50%; background:#fdeceb;
  color:var(--rojo); display:flex; align-items:center; justify-content:center;
  font-size:22px; margin:0 auto 12px;
}
.modal-box h3{font-size:15.5px; margin-bottom:8px; color:var(--texto);}
.modal-box p{font-size:12.5px; color:var(--gris-texto); margin-bottom:18px; line-height:1.4;}

.saludo-row{display:flex; justify-content:space-between; align-items:flex-start; margin-top:2px;}
.saludo{font-size:15px; font-weight:700; color:var(--texto);}
.fecha-hoy{font-size:11.5px; color:var(--gris-texto); margin-top:2px; text-transform:capitalize;}

.hidden{display:none !important;}

.lock-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 28px; background:linear-gradient(180deg, var(--verde-oscuro), var(--verde-medio));
  text-align:center;
}
.lock-logo{
  width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.15);
  display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:14px;
}
.lock-title{color:#fff; font-size:18px; font-weight:800; margin-bottom:6px;}
.lock-sub{color:#cfe4d4; font-size:12.5px; margin-bottom:22px;}
.lock-input{
  width:100%; max-width:280px; border:1.5px solid rgba(255,255,255,.3); border-radius:10px;
  padding:12px 14px; font-size:15px; background:rgba(255,255,255,.95); color:#1a1a1a; text-align:center;
  margin-bottom:10px;
}
.lock-error{color:#ffb4a8; font-size:12px; font-weight:600; margin-bottom:10px;}
.lock-screen .btn{max-width:280px;}

.btn-borrar-item{
  background:#fdeceb; border:1.5px solid #f3c6c0; color:var(--rojo);
  width:38px; height:38px; border-radius:9px; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
[data-theme="oscuro"] .btn-borrar-item{background:#3a2321; border-color:#5c342f;}

.btn-revertir-pago{
  background:#fdf3e6; border:1.5px solid #f0d9ad; color:var(--amarillo);
  padding:9px 12px; border-radius:9px; font-size:11.5px; font-weight:700; cursor:pointer;
  flex-shrink:0; white-space:nowrap; min-height:38px;
}
[data-theme="oscuro"] .btn-revertir-pago{background:#3a2f18; border-color:#5c4a20;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ================== ACCESO CON CONTRASEÑA ==================
   Cambiá el valor de APP_PASSWORD por la contraseña que le vas
   a pasar a tu amigo antes de subir el archivo a GitHub.
================================================================ */
const APP_PASSWORD = "jardin2026";
const UNLOCK_KEY = 'parquiapp_unlocked';

function estaDesbloqueada(){
  return localStorage.getItem(UNLOCK_KEY) === 'si';
}
function intentarDesbloquear(pass){
  if(pass === APP_PASSWORD){
    localStorage.setItem(UNLOCK_KEY, 'si');
    return true;
  }
  return false;
}
function renderLock(mostrarError){
  document.getElementById('app').innerHTML = `
    <div class="lock-screen">
      <div class="lock-logo">&#127807;</div>
      <div class="lock-title">Parquizaciones y Mantenimientos</div>
      <div class="lock-sub">Ingresá la contraseña para acceder</div>
      <input type="password" id="lockInput" class="lock-input" placeholder="Contraseña" autofocus>
      ${mostrarError ? `<div class="lock-error">Contraseña incorrecta, probá de nuevo.</div>` : ''}
      <button class="btn btn-guardar" id="lockBtn">Ingresar</button>
    </div>`;
  const input = document.getElementById('lockInput');
  const btn = document.getElementById('lockBtn');
  const intentar = ()=>{
    if(intentarDesbloquear(input.value)){
      iniciarApp();
    } else {
      renderLock(true);
    }
  };
  btn.addEventListener('click', intentar);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') intentar(); });
  input.focus();
}

function cargarDatos(){
  const raw = localStorage.getItem(DB_KEY);

      migrarDatos(datos);
      return datos;
    }catch(e){}

    config: { nombreNegocio:'Parquizaciones y Mantenimientos', logo:null, tema:'claro' }

/* Compatibilidad con datos guardados por versiones anteriores de la app */
function migrarDatos(datos){
  if(!Array.isArray(datos.trabajos)) return;
  datos.trabajos.forEach(t=>{
    if(t.duracionHoras===undefined){
      const numeroEncontrado = t.duracion ? parseFloat(String(t.duracion).replace(',','.')) : NaN;
      t.duracionHoras = !isNaN(numeroEncontrado) && numeroEncontrado>0 ? numeroEncontrado : 1;
    }
  });
}

function fmtMoney(n){
  return '$' + Number(n||0).toLocaleString('es-AR');
}
function fmtFecha(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d} ${meses[parseInt(m)-1]} ${y}`;
}
function iniciales(nombre){
  return nombre.split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('');
}
function uid(){ return 'id'+Date.now()+Math.random().toString(36).slice(2,7); }
function clienteById(id){ return DB.clientes.find(c=>c.id===id); }

/* Rango de fechas para los filtros de periodo del Balance */
function isoLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function rangoPeriodo(periodo){
  const hoy = new Date();
  if(periodo==='semana'){
    const dia = hoy.getDay(); // 0=domingo
    const diffLunes = (dia===0 ? -6 : 1-dia);
    const lunes = new Date(hoy); lunes.setDate(hoy.getDate()+diffLunes);
    const domingo = new Date(lunes); domingo.setDate(lunes.getDate()+6);
    return {
      desde: isoLocal(lunes), hasta: isoLocal(domingo),
      etiqueta: `Semana del ${fmtFecha(isoLocal(lunes))} al ${fmtFecha(isoLocal(domingo))}`
    };
  }
  if(periodo==='mes'){
    const primero = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    const ultimo = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
    const nombresMes = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return {
      desde: isoLocal(primero), hasta: isoLocal(ultimo),
      etiqueta: `${nombresMes[hoy.getMonth()]} ${hoy.getFullYear()}`
    };
  }
  return { desde:null, hasta:null, etiqueta:'Todo el historial' };
}
function dentroDeRango(fecha, rango){
  if(!rango.desde) return true;
  return fecha >= rango.desde && fecha <= rango.hasta;
}
function datosPeriodo(periodo){
  const rango = rangoPeriodo(periodo);
  const ingresosTrabajos = DB.trabajos.filter(t=>t.estado==='finalizado' && t.pago==='pagado' && dentroDeRango(t.fecha, rango))
    .map(t=>({fecha:t.fecha, desc:`${t.tipo} · ${clienteById(t.clienteId)?.nombre||''}`, monto:t.valor, tipo:'ingreso'}));
  const ingresosManuales = DB.ingresosManuales.filter(i=>dentroDeRango(i.fecha, rango))
    .map(i=>({fecha:i.fecha, desc:i.concepto, monto:i.monto, tipo:'ingreso'}));
  const gastos = DB.gastos.filter(g=>dentroDeRango(g.fecha, rango))
    .map(g=>({fecha:g.fecha, desc:g.concepto, monto:g.monto, tipo:'gasto'}));
  const pendientesPeriodo = DB.trabajos.filter(t=>t.estado==='finalizado' && t.pago==='pendiente' && dentroDeRango(t.fecha, rango));
  const totalIng = ingresosTrabajos.reduce((s,m)=>s+Number(m.monto||0),0) + ingresosManuales.reduce((s,m)=>s+Number(m.monto||0),0);
  const totalGas = gastos.reduce((s,m)=>s+Number(m.monto||0),0);
  const totalPend = pendientesPeriodo.reduce((s,t)=>s+Number(t.valor||0),0);
  const movimientos = [...ingresosTrabajos, ...ingresosManuales, ...gastos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return { rango, movimientos, totalIng, totalGas, totalPend, balance: totalIng-totalGas };
}

/* Cálculo de horarios (hora de fin y detección de superposición) */
function horaAMinutos(horaStr){
  const [h,m] = (horaStr||'00:00').split(':').map(Number);
  return (h||0)*60 + (m||0);
}
function minutosAHora(mins){
  const m = ((mins % 1440) + 1440) % 1440; // por si pasa medianoche
  const hh = Math.floor(m/60), mm = m%60;
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}
function horaFinTrabajo(t){
  const dur = Number(t.duracionHoras);
  if(!t.hora || !dur) return null;
  return minutosAHora(horaAMinutos(t.hora) + Math.round(dur*60));
}
function rangoHorarioTexto(t){
  const fin = horaFinTrabajo(t);
  return fin ? `${t.hora} a ${fin}` : (t.hora || '');
}
function seSuperponen(t1, t2){
  if(t1.fecha !== t2.fecha) return false;
  const dur1 = Number(t1.duracionHoras)||0, dur2 = Number(t2.duracionHoras)||0;
  if(!dur1 || !dur2) return false;
  const ini1 = horaAMinutos(t1.hora), fin1 = ini1 + dur1*60;
  const ini2 = horaAMinutos(t2.hora), fin2 = ini2 + dur2*60;
  return ini1 < fin2 && ini2 < fin1;
}
function trabajoSuperpuestoCon(trabajo){
  const otro = DB.trabajos.find(t => t.id!==trabajo.id && t.fecha===trabajo.fecha && seSuperponen(trabajo, t));
  if(!otro) return null;
  const c = clienteById(otro.clienteId);
  return c ? c.nombre : 'otro trabajo';
}

function deudaCliente(clienteId){
  return DB.trabajos
    .filter(t=>t.clienteId===clienteId && t.estado==='finalizado' && t.pago==='pendiente')
    .reduce((sum,t)=>sum+Number(t.valor||0),0);
}
function trabajosCliente(clienteId){
  return DB.trabajos.filter(t=>t.clienteId===clienteId && t.estado==='finalizado')
    .sort((a,b)=> b.fecha.localeCompare(a.fecha));
}
function trabajosDeFecha(iso){
  return DB.trabajos.filter(t=>t.fecha===iso).sort((a,b)=> a.hora.localeCompare(b.hora));
}
function totalIngresos(){
  const deTrabajos = DB.trabajos.filter(t=>t.estado==='finalizado' && t.pago==='pagado')
    .reduce((s,t)=>s+Number(t.valor||0),0);
  const manuales = DB.ingresosManuales.reduce((s,i)=>s+Number(i.monto||0),0);
  return deTrabajos + manuales;
}
function totalPendiente(){
  return DB.trabajos.filter(t=>t.estado==='finalizado' && t.pago==='pendiente')
    .reduce((s,t)=>s+Number(t.valor||0),0);
}
function totalGastos(){
  return DB.gastos.reduce((s,g)=>s+Number(g.monto||0),0);
}
function balanceGeneral(){
  return totalIngresos() - totalGastos();
}

/* ================== PANTALLA: AGENDA ================== */
function screenAgenda(){
  const hoy = new Date();
  const mesActual = nav.params.mes!==undefined ? nav.params.mes : hoy.getMonth();
  const anioActual = nav.params.anio!==undefined ? nav.params.anio : hoy.getFullYear();
  const diaSel = nav.params.dia || hoyISO();

  const primerDia = new Date(anioActual, mesActual, 1);
  const ultimoDia = new Date(anioActual, mesActual+1, 0);
  const offset = primerDia.getDay();
  const nombresMes = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const diasConTurno = new Set(DB.trabajos.map(t=>t.fecha));

  let celdas = '';
  for(let i=0;i<offset;i++) celdas += `<span class="cal-day vacio"></span>`;
  for(let d=1; d<=ultimoDia.getDate(); d++){
    const iso = `${anioActual}-${String(mesActual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const clases = ['cal-day'];
    if(diasConTurno.has(iso)) clases.push('con-turno');
    if(iso===diaSel) clases.push('seleccionado');
    celdas += `<span class="${clases.join(' ')}" data-select-dia="${iso}" data-mes="${mesActual}" data-anio="${anioActual}">${d}</span>`;
  }

  const turnosDia = trabajosDeFecha(diaSel);
  const fechaLegible = new Date(diaSel+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'long'});

  return `
  ${header('Mi agenda')}
  <div class="content">
    <div class="cal-nav">
      <button data-action="mesAnterior" data-mes="${mesActual}" data-anio="${anioActual}" data-dia="${diaSel}">&#8249;</button>
      <span>${nombresMes[mesActual]} ${anioActual}</span>
      <button data-action="mesSiguiente" data-mes="${mesActual}" data-anio="${anioActual}" data-dia="${diaSel}">&#8250;</button>
    </div>
    <div class="cal-grid">
      <span class="cal-dow">D</span><span class="cal-dow">L</span><span class="cal-dow">M</span>
      <span class="cal-dow">M</span><span class="cal-dow">J</span><span class="cal-dow">V</span><span class="cal-dow">S</span>
      ${celdas}
    </div>

    <div class="section-title">Turnos · ${fechaLegible}</div>
    ${turnosDia.length===0 ? `<div class="empty-state">No hay turnos este día.</div>` :
      turnosDia.map(t=>renderTurnoItem(t)).join('')
    }
  </div>
  <div class="content" style="padding-top:0;">
    <button class="btn btn-guardar" data-action="nuevoTurnoDia" data-dia="${diaSel}">+ Nuevo turno</button>
  </div>`;
}

/* ================== EVENTOS ================== */
function attachEvents(){
  const app = document.getElementById('app');

  // Navegación simple por data-goto (excluye el menú inferior, que tiene su propio manejador)
  app.querySelectorAll('[data-goto]:not(.nav-btn)').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = el.getAttribute('data-goto');
      goTo(s);
    });
  });

  app.querySelectorAll('[data-action="back"]').forEach(el=> el.addEventListener('click', goBack));

  // Clientes
  const buscadorC = document.getElementById('buscadorClientes');
  if(buscadorC){
    buscadorC.addEventListener('input', (e)=>{
      nav.params.q = e.target.value;
      const cursorPos = e.target.selectionStart;
      render();
      const el2 = document.getElementById('buscadorClientes');
      if(el2){ el2.focus(); el2.setSelectionRange(cursorPos, cursorPos); }
    });
  }
  app.querySelectorAll('[data-goto-cliente]').forEach(el=>{
    el.addEventListener('click', ()=> goTo('clienteDetalle', {id: el.getAttribute('data-goto-cliente')}));
  });
  app.querySelectorAll('[data-action="nuevoCliente"]').forEach(el=>{
    el.addEventListener('click', ()=> goTo('clienteForm', {}));
  });

  const btnGuardarCliente = app.querySelector('[data-action="guardarCliente"]');
  if(btnGuardarCliente){
    btnGuardarCliente.addEventListener('click', ()=>{
      const nombre = document.getElementById('f-nombre').value.trim();
      if(!nombre){ alert('Poné al menos el nombre del cliente.'); return; }
      const id = btnGuardarCliente.getAttribute('data-id');
      const datos = {
        nombre,
        direccion: document.getElementById('f-direccion').value.trim(),
        telefono: document.getElementById('f-telefono').value.trim(),
        notas: document.getElementById('f-notas').value.trim()
      };
      if(id){
        Object.assign(clienteById(id), datos);
      } else {
        DB.clientes.push({id:uid(), ...datos});
      }
      guardar();
      goBack();
    });
  }
  const btnEditarCliente = app.querySelector('[data-action="editarCliente"]');
  if(btnEditarCliente) btnEditarCliente.addEventListener('click', ()=> goTo('clienteForm', {id: btnEditarCliente.getAttribute('data-id')}));

  const btnPedirEliminar = app.querySelector('[data-action="pedirEliminarCliente"]');
  if(btnPedirEliminar) btnPedirEliminar.addEventListener('click', ()=>{
    nav.params.confirmDelete = true; render();
  });
  app.querySelectorAll('[data-action="cerrarModal"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      nav.params.confirmDelete = false; render();
    });
  });
  const btnConfirmarEliminar = app.querySelector('[data-action="confirmarEliminarCliente"]');
  if(btnConfirmarEliminar) btnConfirmarEliminar.addEventListener('click', ()=>{
    const id = btnConfirmarEliminar.getAttribute('data-id');
    DB.clientes = DB.clientes.filter(c=>c.id!==id);
    DB.trabajos = DB.trabajos.filter(t=>t.clienteId!==id);
    guardar();
    goToReplace('clientes', {});
  });

  // Turnos
  app.querySelectorAll('[data-goto-turno]').forEach(el=>{
    el.addEventListener('click', ()=> abrirTurnoModal(el.getAttribute('data-goto-turno')));
  });
  const buscarClienteTurno = document.getElementById('buscarClienteTurno');
  if(buscarClienteTurno){
    buscarClienteTurno.addEventListener('input', (e)=>{
      nav.params.buscar = e.target.value;
      render();
      const el2 = document.getElementById('buscarClienteTurno');
      if(el2){ el2.focus(); el2.setSelectionRange(el2.value.length, el2.value.length); }
    });
  }
  app.querySelectorAll('[data-select-cliente]').forEach(el=>{
    el.addEventListener('click', ()=>{
      nav.params.clienteId = el.getAttribute('data-select-cliente');
      // preservar campos ya tipeados
      const f = camposTurnoActuales();
      Object.assign(nav.params, f);
      render();
    });
  });
  const btnGuardarTurno = app.querySelector('[data-action="guardarTurno"]');
  if(btnGuardarTurno){
    btnGuardarTurno.addEventListener('click', ()=>{
      const clienteId = btnGuardarTurno.getAttribute('data-cliente');
      if(!clienteId){ alert('Elegí un cliente de la lista.'); return; }
      const fecha = document.getElementById('f-fecha').value;
      const hora = document.getElementById('f-hora').value;
      if(!fecha || !hora){ alert('Completá el día y la hora.'); return; }
      DB.trabajos.push({
        id:uid(), clienteId, fecha, hora,
        duracionHoras: Number(document.getElementById('f-duracion').value)||1,
        valor: 0,
        tipo: document.getElementById('f-tipo').value.trim() || 'Trabajo',
        estado:'por_hacer', pago:null
      });
      guardar();
      goToReplace('agenda', {dia:fecha});
    });
  }

  // Aviso de superposición en vivo mientras se completa el formulario de turno
  function actualizarAvisoSuperposicion(){
    const avisoEl = document.getElementById('avisoSuperposicion');
    if(!avisoEl) return;
    const fechaEl = document.getElementById('f-fecha');
    const horaEl = document.getElementById('f-hora');
    const durEl = document.getElementById('f-duracion');
    if(!fechaEl || !horaEl || !durEl){ avisoEl.innerHTML=''; return; }
    const tPrueba = { id:'__nuevo__', fecha: fechaEl.value, hora: horaEl.value, duracionHoras: Number(durEl.value) };
    const chocaCon = DB.trabajos
      .filter(t => t.fecha===tPrueba.fecha && seSuperponen(tPrueba, t))
      .map(t => clienteById(t.clienteId)?.nombre || 'otro cliente');
    if(chocaCon.length){
      avisoEl.innerHTML = `<div class="aviso-superposicion">&#9888;&#65039; Este horario se superpone con el turno de <b>${chocaCon.join(', ')}</b> ese mismo día. Revisá si podés cumplir los dos o si conviene mandar a alguien más.</div>`;
    } else {
      avisoEl.innerHTML = '';
    }
  }
  if(document.getElementById('avisoSuperposicion')){
    ['f-fecha','f-hora','f-duracion'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('change', actualizarAvisoSuperposicion);
    });
    actualizarAvisoSuperposicion();
  }
  const btnNuevoTurnoDia = app.querySelector('[data-action="nuevoTurnoDia"]');
  if(btnNuevoTurnoDia) btnNuevoTurnoDia.addEventListener('click', ()=>{
    goTo('turnoForm', {fecha: btnNuevoTurnoDia.getAttribute('data-dia')});
  });

  // Agenda calendario
  app.querySelectorAll('[data-select-dia]').forEach(el=>{
    el.addEventListener('click', ()=>{
      nav.params.dia = el.getAttribute('data-select-dia');
      nav.params.mes = parseInt(el.getAttribute('data-mes'));
      nav.params.anio = parseInt(el.getAttribute('data-anio'));
      render();
    });
  });
  const btnMesAnt = app.querySelector('[data-action="mesAnterior"]');
  if(btnMesAnt) btnMesAnt.addEventListener('click', ()=>{
    let m = parseInt(btnMesAnt.getAttribute('data-mes')), a = parseInt(btnMesAnt.getAttribute('data-anio'));
    m--; if(m<0){m=11;a--;}
    nav.params = {mes:m, anio:a, dia:nav.params.dia};
    render();
  });
  const btnMesSig = app.querySelector('[data-action="mesSiguiente"]');
  if(btnMesSig) btnMesSig.addEventListener('click', ()=>{
    let m = parseInt(btnMesSig.getAttribute('data-mes')), a = parseInt(btnMesSig.getAttribute('data-anio'));
    m++; if(m>11){m=0;a++;}
    nav.params = {mes:m, anio:a, dia:nav.params.dia};
    render();
  });

  // Ingresos manuales
  const btnNuevoIngreso = app.querySelector('[data-action="nuevoIngreso"]');
  if(btnNuevoIngreso) btnNuevoIngreso.addEventListener('click', ()=> goTo('ingresoForm'));
  const btnGuardarIngreso = app.querySelector('[data-action="guardarIngresoManual"]');
  if(btnGuardarIngreso) btnGuardarIngreso.addEventListener('click', ()=>{
    const concepto = document.getElementById('f-concepto').value.trim();
    const monto = Number(document.getElementById('f-monto').value)||0;
    if(!concepto || monto<=0){ alert('Completá el concepto y el monto.'); return; }
    DB.ingresosManuales.push({id:uid(), concepto, monto, fecha: document.getElementById('f-fecha-mov').value});
    guardar();
    goToReplace('cajaIngresos', {});
  });

  // Gastos
  const btnNuevoGasto = app.querySelector('[data-action="nuevoGasto"]');
  if(btnNuevoGasto) btnNuevoGasto.addEventListener('click', ()=> goTo('gastoForm'));
  const btnGuardarGasto = app.querySelector('[data-action="guardarGasto"]');
  if(btnGuardarGasto) btnGuardarGasto.addEventListener('click', ()=>{
    const concepto = document.getElementById('f-concepto').value.trim();
    const monto = Number(document.getElementById('f-monto').value)||0;
    if(!concepto || monto<=0){ alert('Completá el concepto y el monto.'); return; }
    DB.gastos.push({id:uid(), concepto, monto, fecha: document.getElementById('f-fecha-mov').value});
    guardar();
    goToReplace('cajaGastos', {});
  });

  // Pendientes -> marcar como pagado directo
  app.querySelectorAll('[data-marcar-pagado]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-marcar-pagado');
      const t = DB.trabajos.find(x=>x.id===id);
      if(t){ t.pago = 'pagado'; guardar(); render(); }
    });
  });

  // Ingresos -> revertir un pago marcado por error
  app.querySelectorAll('[data-revertir-pago]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-revertir-pago');
      const t = DB.trabajos.find(x=>x.id===id);
      if(t){ t.pago = 'pendiente'; guardar(); render(); }
    });
  });

  // Balance -> filtro de periodo (todo / semana / mes)
  app.querySelectorAll('[data-set-periodo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      nav.params.periodo = el.getAttribute('data-set-periodo');
      render();
    });
  });

  // Balance -> descargar PDF del mes
  const btnPdfMes = app.querySelector('#btnDescargarPdfMes');
  if(btnPdfMes) btnPdfMes.addEventListener('click', generarPdfMes);

  // Turnos -> recordatorio por WhatsApp
  app.querySelectorAll('[data-whatsapp-turno]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      abrirRecordatorioWhatsApp(el.getAttribute('data-whatsapp-turno'));
    });
  });

  // Copia de seguridad: descargar
  const btnDescargarBackup = app.querySelector('#btnDescargarBackup');
  if(btnDescargarBackup) btnDescargarBackup.addEventListener('click', descargarBackup);

  // Copia de seguridad: restaurar
  const btnRestaurarBackup = app.querySelector('#btnRestaurarBackup');
  const inputRestaurarBackup = document.getElementById('inputRestaurarBackup');
  if(btnRestaurarBackup && inputRestaurarBackup){
    btnRestaurarBackup.addEventListener('click', ()=> inputRestaurarBackup.click());
    inputRestaurarBackup.addEventListener('change', (e)=>{
      const archivo = e.target.files[0];
      if(archivo) restaurarBackup(archivo);
    });
  }

  // Borrar gasto
  app.querySelectorAll('[data-borrar-gasto]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-borrar-gasto');
      confirmarBorrado('¿Eliminar este gasto?', 'Esta acción no se puede deshacer.', ()=>{
        DB.gastos = DB.gastos.filter(g=>g.id!==id);
        guardar();
        render();
      });
    });
  });

  // Borrar ingreso manual
  app.querySelectorAll('[data-borrar-ingreso]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-borrar-ingreso');
      confirmarBorrado('¿Eliminar este ingreso?', 'Esta acción no se puede deshacer.', ()=>{
        DB.ingresosManuales = DB.ingresosManuales.filter(i=>i.id!==id);
        guardar();
        render();
      });
    });
  });

  // Borrar un pendiente de pago (elimina el trabajo asociado)
  app.querySelectorAll('[data-borrar-pendiente]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-borrar-pendiente');
      confirmarBorrado('¿Eliminar este pendiente?', 'Se va a borrar el registro de este trabajo, incluyendo su historial. Esta acción no se puede deshacer.', ()=>{
        DB.trabajos = DB.trabajos.filter(t=>t.id!==id);
        guardar();
        render();
      });
    });
  });

  // Más opciones
  // (navegación a datosNegocio ya cubierta por el handler genérico [data-goto])

  // Borrar todos los datos
  const btnBorrarTodo = app.querySelector('[data-action="borrarTodosDatos"]');
  if(btnBorrarTodo){
    btnBorrarTodo.addEventListener('click', ()=>{
      confirmarBorrado(
        '¿Borrar todos los datos?',
        'Se van a eliminar todos los clientes, turnos, ingresos y gastos cargados. El nombre, logo y tema del negocio se mantienen. Esta acción no se puede deshacer.',
        ()=>{
          DB.clientes = [];
          DB.trabajos = [];
          DB.gastos = [];
          DB.ingresosManuales = [];
          guardar();
          navStack.length = 0;
          goTo('home', {}, false);
        }
      );
    });
  }

  // Apariencia (pantalla especial fuera del switch principal por simplicidad se maneja aparte)
  if(nav.screen==='apariencia'){
    app.querySelectorAll('[data-set-tema]').forEach(el=>{
      el.addEventListener('click', ()=>{
        DB.config.tema = el.getAttribute('data-set-tema');
        guardar();
        render();
      });
    });
  }

  // Datos del negocio
  const logoPreview = document.getElementById('logoInput');
  app.querySelectorAll('[data-action="triggerLogo"]').forEach(el=>{
    el.addEventListener('click', ()=> logoPreview && logoPreview.click());
  });
  if(logoPreview){
    logoPreview.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        DB.config.logo = ev.target.result;
        guardar();
        render();
      };
      reader.readAsDataURL(file);
    });
  }
  const btnGuardarNegocio = app.querySelector('[data-action="guardarDatosNegocio"]');
  if(btnGuardarNegocio) btnGuardarNegocio.addEventListener('click', ()=>{
    const nombre = document.getElementById('f-nombre-negocio').value.trim();
    if(nombre) DB.config.nombreNegocio = nombre;
    guardar();
    goToReplace('masOpciones', {});
  });

  // Bottom nav
  app.querySelectorAll('.nav-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      navStack.length = 0;
      goTo(el.getAttribute('data-goto'), {}, false);
    });
  });
}

    fecha: get('f-fecha'), hora: get('f-hora'),

/* ================== MODAL: marcar turno finalizado / pago ================== */
/* ================== MODAL GENÉRICO DE CONFIRMACIÓN ================== */
function confirmarBorrado(titulo, mensaje, onConfirmar, opts={}){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const icono = opts.icono || '&#128465;';
  const textoBoton = opts.textoBoton || 'Eliminar';
  overlay.innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="icon">${icono}</div>
      <h3>${titulo}</h3>
      <p>${mensaje}</p>
      <button class="btn btn-eliminar" id="btnConfirmarBorrado">${textoBoton}</button>
      <button class="btn btn-cancelar" id="btnCancelarBorrado">Cancelar</button>
    </div>`;
  overlay.addEventListener('click', ()=> overlay.remove());
  document.getElementById('app').appendChild(overlay);
  document.getElementById('btnCancelarBorrado').addEventListener('click', (e)=>{ e.stopPropagation(); overlay.remove(); });
  document.getElementById('btnConfirmarBorrado').addEventListener('click', (e)=>{
    e.stopPropagation();
    overlay.remove();
    onConfirmar();
  });
}

/* ================== PDF DEL BALANCE MENSUAL ================== */
function generarPdfMes(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert('No se pudo generar el PDF. Revisá que el celular tenga conexión a internet e intentá de nuevo.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const { rango, movimientos, totalIng, totalGas, totalPend, balance } = datosPeriodo('mes');
  const doc = new jsPDF();
  const verdeOsc = [18,52,28];

  doc.setFillColor(...verdeOsc);
  doc.rect(0,0,210,26,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16);
  doc.text(DB.config.nombreNegocio, 14, 12);
  doc.setFontSize(11);
  doc.text(`Balance · ${rango.etiqueta}`, 14, 20);

  let y = 38;
  doc.setTextColor(20,20,20);
  doc.setFontSize(12);
  doc.text(`Ingresos del mes:`, 14, y); doc.text(fmtMoney(totalIng), 196, y, {align:'right'});
  y += 8;
  doc.text(`Gastos del mes:`, 14, y); doc.text(fmtMoney(totalGas), 196, y, {align:'right'});
  y += 8;
  doc.setFont(undefined,'bold');
  doc.text(`Balance del mes:`, 14, y); doc.text(fmtMoney(balance), 196, y, {align:'right'});
  doc.setFont(undefined,'normal');
  y += 8;
  doc.setTextColor(138,100,16);
  doc.text(`Pendiente por cobrar:`, 14, y); doc.text(fmtMoney(totalPend), 196, y, {align:'right'});
  doc.setTextColor(20,20,20);

  y += 14;
  doc.setFontSize(12);
  doc.setFont(undefined,'bold');
  doc.text('Movimientos', 14, y);
  doc.setFont(undefined,'normal');
  y += 4;
  doc.setDrawColor(220,220,220);
  doc.line(14, y, 196, y);
  y += 7;
  doc.setFontSize(10);

  if(movimientos.length===0){
    doc.setTextColor(120,120,120);
    doc.text('No hay movimientos este mes.', 14, y);
  } else {
    movimientos.forEach(m=>{
      if(y > 280){ doc.addPage(); y = 20; }
      doc.setTextColor(20,20,20);
      doc.text(fmtFecha(m.fecha), 14, y);
      doc.text(m.desc.length>55 ? m.desc.slice(0,55)+'…' : m.desc, 42, y);
      if(m.tipo==='ingreso'){ doc.setTextColor(47,138,76); doc.text('+'+fmtMoney(m.monto), 196, y, {align:'right'}); }
      else { doc.setTextColor(192,57,43); doc.text('-'+fmtMoney(m.monto), 196, y, {align:'right'}); }
      y += 7;
    });
  }

  const nombreArchivo = `balance-${rango.etiqueta.toLowerCase().replace(/\s+/g,'-')}.pdf`;
  doc.save(nombreArchivo);
}

/* ================== RECORDATORIO POR WHATSAPP ================== */
function telefonoWhatsApp(telefono){
  let limpio = (telefono||'').replace(/\D/g,'');
  if(!limpio) return null;
  if(!limpio.startsWith('54')) limpio = '549' + limpio.replace(/^0+/,'');
  return limpio;
}
function abrirRecordatorioWhatsApp(turnoId){
  const t = DB.trabajos.find(x=>x.id===turnoId);
  if(!t) return;
  const c = clienteById(t.clienteId);
  if(!c || !c.telefono){ alert('Este cliente no tiene un teléfono cargado.'); return; }
  const numero = telefonoWhatsApp(c.telefono);
  const fechaLegible = new Date(t.fecha+'T00:00:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
  const mensaje = `Hola ${c.nombre}! Te escribo para recordarte tu turno de ${t.tipo} el ${fechaLegible} a las ${t.hora}. ¡Nos vemos!`;
  const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
}

/* ================== COPIA DE SEGURIDAD ================== */
function screenCopiaSeguridad(){
  return `
  ${header('Copia de seguridad')}
  <div class="content">
    <p style="font-size:12.5px; color:var(--gris-texto); line-height:1.5; margin-bottom:16px;">
      Todos los datos de la app (clientes, turnos, ingresos y gastos) se guardan solo en este celular.
      Descargá una copia de vez en cuando para no perderlos si cambiás de teléfono o se borra el navegador.
    </p>
    <button class="btn btn-guardar" id="btnDescargarBackup">&#128190; Descargar copia de seguridad</button>

    <div style="margin-top:22px; padding-top:18px; border-top:1.5px solid var(--borde);">
      <p style="font-size:12.5px; color:var(--gris-texto); line-height:1.5; margin-bottom:12px;">
        ¿Ya tenés un archivo de copia guardado? Restaurala acá. <b>Esto reemplaza todos los datos actuales</b> por los del archivo.
      </p>
      <input type="file" id="inputRestaurarBackup" accept="application/json" class="hidden">
      <button class="btn btn-cancelar" id="btnRestaurarBackup">&#128194; Restaurar copia de seguridad</button>
    </div>
  </div>`;
}
function descargarBackup(){
  const datos = JSON.stringify(DB, null, 2);
  const blob = new Blob([datos], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const nombreNegocio = (DB.config.nombreNegocio||'negocio').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  a.download = `backup-${nombreNegocio}-${hoyISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restaurarBackup(archivo){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    let datos;
    try{ datos = JSON.parse(ev.target.result); }
    catch(e){ alert('Este archivo no es una copia de seguridad válida.'); return; }
    if(!Array.isArray(datos.clientes) || !Array.isArray(datos.trabajos)){
      alert('Este archivo no es una copia de seguridad válida.');
      return;
    }
    confirmarBorrado(
      '¿Restaurar esta copia?',
      'Se van a reemplazar todos los clientes, turnos, ingresos y gastos actuales por los del archivo. Esta acción no se puede deshacer.',
      ()=>{
        DB = {
          clientes: datos.clientes||[],
          trabajos: datos.trabajos||[],
          gastos: datos.gastos||[],
          ingresosManuales: datos.ingresosManuales||[],
          config: datos.config || DB.config
        };
        migrarDatos(DB);
        guardar();
        navStack.length = 0;
        goTo('home', {}, false);
      },
      { icono:'&#128194;', textoBoton:'Restaurar' }
    );
  };
  reader.readAsText(archivo);
}

function abrirTurnoModal(turnoId){
  const t = DB.trabajos.find(x=>x.id===turnoId);
  if(!t) return;
  const c = clienteById(t.clienteId);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  let pagoSeleccionado = t.pago || 'pendiente';
  let valorActual = t.valor || '';

  function pintarModal(){
    overlay.innerHTML = `
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="icon" style="background:#eaf7ee; color:var(--verde-claro);">&#128203;</div>
        <h3>${c?c.nombre:'Turno'}</h3>
        <p>${t.tipo} · ${rangoHorarioTexto(t)}</p>
        ${trabajoSuperpuestoCon(t) ? `<p style="color:var(--rojo); font-weight:700; font-size:12px; margin-top:-8px;">&#9888;&#65039; Se superpone con ${trabajoSuperpuestoCon(t)}</p>` : ''}
        ${t.estado==='por_hacer' ? `
          <div class="field" style="text-align:left;">
            <label>Valor del servicio</label>
            <input id="inputValorFinal" type="number" placeholder="Ej: 8500" value="${valorActual}">
          </div>
          <p style="font-size:11px; color:var(--gris-texto); text-align:left; text-transform:uppercase; font-weight:700; letter-spacing:.3px; margin-bottom:6px;">Estado de pago</p>
          <div class="pago-toggle" style="margin-bottom:14px;">
            <button class="pago-opt ${pagoSeleccionado==='pendiente'?'activo-pendiente':''}" id="btnSelPendiente">Pendiente</button>
            <button class="pago-opt ${pagoSeleccionado==='pagado'?'activo-pagado':''}" id="btnSelPagado">Pagado</button>
          </div>
          <button class="btn btn-guardar" id="btnMarcarFinalizado">Marcar como finalizado</button>
          <button class="btn btn-cancelar" id="btnCerrarTurnoModal">Cerrar</button>
        ` : `
          <p style="margin-top:-6px; font-weight:700;">${fmtMoney(t.valor)}</p>
          <p style="margin-top:-6px; margin-bottom:10px;">&#191;Cómo quedó el pago?</p>
          <div class="pago-toggle" style="margin-bottom:12px;">
            <button class="pago-opt ${t.pago==='pendiente'?'activo-pendiente':''}" id="btnPagoPendiente">Pendiente</button>
            <button class="pago-opt ${t.pago==='pagado'?'activo-pagado':''}" id="btnPagoPagado">Pagado</button>
          </div>
          <button class="btn btn-cancelar" id="btnCerrarTurnoModal">Cerrar</button>
        `}
      </div>`;

    const cerrar = document.getElementById('btnCerrarTurnoModal');
    if(cerrar) cerrar.addEventListener('click', (e)=>{ e.stopPropagation(); overlay.remove(); });

    const inputValorEl = document.getElementById('inputValorFinal');
    if(inputValorEl) inputValorEl.addEventListener('input', (e)=>{ valorActual = e.target.value; });

    const btnSelPend = document.getElementById('btnSelPendiente');
    if(btnSelPend) btnSelPend.addEventListener('click', (e)=>{ e.stopPropagation(); pagoSeleccionado='pendiente'; pintarModal(); });
    const btnSelPag = document.getElementById('btnSelPagado');
    if(btnSelPag) btnSelPag.addEventListener('click', (e)=>{ e.stopPropagation(); pagoSeleccionado='pagado'; pintarModal(); });

    const btnFin = document.getElementById('btnMarcarFinalizado');
    if(btnFin) btnFin.addEventListener('click', (e)=>{
      e.stopPropagation();
      t.valor = Number(valorActual)||0;
      t.estado = 'finalizado';
      t.pago = pagoSeleccionado;
      guardar();
      overlay.remove();
      render();
    });
    const btnPend = document.getElementById('btnPagoPendiente');
    if(btnPend) btnPend.addEventListener('click', (e)=>{ e.stopPropagation(); t.pago='pendiente'; guardar(); overlay.remove(); render(); });
    const btnPag = document.getElementById('btnPagoPagado');
    if(btnPag) btnPag.addEventListener('click', (e)=>{ e.stopPropagation(); t.pago='pagado'; guardar(); overlay.remove(); render(); });
  }

  overlay.addEventListener('click', ()=> overlay.remove());
  document.getElementById('app').appendChild(overlay);
  pintarModal();
}

  DB = cargarDatos();
  render();
}
